# The gate (`npm run check`: Prettier, ESLint, tsc, Knip, dependency-cruiser, the tests) on every pull request and
# every push to main, on the oldest Node the package supports (`engines`) and the current one. lefthook runs it
# locally too, but a hook can be skipped and a pull request from a fork never runs it.
#
# The `workflows` job lints Tether's own workflows and the one the sync Worker ships with actionlint and zizmor, both
# at an exact version whose download is checked against its sha256. The v0.6.8 workflow in test/workflows/ is a
# fixture of what old copies run, and is left as it is.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      # test/upgrade-from-released.test.js installs this tree into copies made from release tags, and fails when a
      # release's updater is not among them: every release tag, so a new one can't be left out here.
      - run: git fetch --depth=1 --no-tags origin '+refs/tags/v*:refs/tags/v*'
      - run: npm ci
      # Any advisory against a dependency, dev-only included, fails the run: fix it with an update or an override.
      - run: npm audit --audit-level=low
      - run: npm run check

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The sha256 is the one in the release's actionlint_1.7.12_checksums.txt.
      - name: actionlint
        shell: bash
        env:
          ACTIONLINT: actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ACTIONLINT" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$ACTIONLINT"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$ACTIONLINT" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$ACTIONLINT" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml server/.github/workflows/update-tether.yml
      # The sha256 is PyPI's for zizmor-1.31.1-py3-none-manylinux_2_28_x86_64.whl. The token lets zizmor check that each
      # pinned commit belongs to its action's repository.
      - name: zizmor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          echo 'zizmor==1.31.1 --hash=sha256:58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410' > "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --only-binary :all: --require-hashes -r "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" .github/workflows server/.github/workflows
